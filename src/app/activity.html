<figure>
  <div class="scroll" tabindex="0" aria-label="Mapa de commits por dia; role para o lado para ver todos os meses">
    <div class="grid" role="img" [attr.aria-label]="total() + ' commits em ' + activeDays() + ' dias, de dezembro de 2025 a outubro de 2026'">
      @for (week of weeks(); track $index; let w = $index) {
        <div class="week" [style.--w]="w">
          <span class="month">{{ week.month ?? '' }}</span>
          @for (cell of week.cells; track $index) {
            @if (cell) {
              <span class="cell" [class]="'cell l' + cell.level" [title]="cell.label"></span>
            } @else {
              <span class="cell empty"></span>
            }
          }
        </div>
      }
    </div>
  </div>
  <figcaption>
    <span>{{ total() }} commits em {{ activeDays() }} dias diferentes</span>
    <span class="legend" aria-hidden="true">
      menos <i class="cell l0"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i
      ><i class="cell l4"></i> mais
    </span>
  </figcaption>
</figure>
